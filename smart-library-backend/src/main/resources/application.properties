spring.application.name=SmartLibraryBackend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_library}
spring.datasource.username=${DB_USERNAME:smartlibrary_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:${SERVER_PORT:8081}}

management.endpoints.web.exposure.include=health,info